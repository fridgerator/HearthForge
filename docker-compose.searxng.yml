# SearXNG for HearthForge
#
# Self-hosted metasearch engine that gives the tool agent
# access to current API documentation and web search results.
#
# Usage:
#   docker compose -f docker-compose.searxng.yml up -d
#
# Once running, SearXNG is available at http://localhost:8080
# The tool agent connects to it automatically.
#
# Based on: https://github.com/searxng/searxng/blob/master/container/docker-compose.yml

name: hearthforge-search

services:
  searxng:
    container_name: hearthforge-searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng-config:/etc/searxng:Z
      - searxng-data:/var/cache/searxng/
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
    depends_on:
      - valkey

  valkey:
    container_name: hearthforge-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data/

volumes:
  searxng-data:
  valkey-data:
